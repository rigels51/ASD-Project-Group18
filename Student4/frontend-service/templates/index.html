<!doctype html>
<html>
  <head>
    <title>Course & Enrollment Management</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <main class="app-shell">

      <header class="app-header">
        <h1>Course & Enrollment Management</h1>
        <p>Normal Mode and AI Mode</p>
      </header>

      <section class="tab-shell card">

        <nav class="tab-nav" aria-label="Application tabs">

          <button
            class="tab-btn is-active"
            data-tab="normal"
            type="button"
          >
            Courses & Enrolments
          </button>

          <button
            class="tab-btn"
            data-tab="ai-mode"
            type="button"
          >
            AI Agent
          </button>

        </nav>

        <div class="tab-content">

          <iframe
            id="tab-frame-normal"
            class="tab-frame is-active"
            src="tabs/normal.html"
            title="Courses and Enrolments"
          ></iframe>

          <iframe
            id="tab-frame-ai-mode"
            class="tab-frame"
            src="tabs/ai-mode.html"
            title="AI Agent"
          ></iframe>

        </div>

      </section>

    </main>

    <script>

      const tabButtons = Array.from(
        document.querySelectorAll(".tab-btn")
      );

      const tabFrames = {
        normal: document.getElementById("tab-frame-normal"),
        "ai-mode": document.getElementById("tab-frame-ai-mode"),
      };


      function resizeFrame(frame) {

        try {

          const doc = frame.contentWindow.document;

          const height = Math.max(
            doc.body.scrollHeight,
            doc.documentElement.scrollHeight
          );

          frame.style.height = height + "px";

        } catch (e) {

          // CSS min-height fallback

        }

      }


      function activateTab(tabName) {

        tabButtons.forEach((button) => {

          button.classList.toggle(
            "is-active",
            button.dataset.tab === tabName
          );

        });


        Object.entries(tabFrames).forEach(([name, frame]) => {

          const isActive = name === tabName;

          frame.classList.toggle(
            "is-active",
            isActive
          );

          if (isActive) {
            resizeFrame(frame);
          }

        });


        window.location.hash = tabName;

      }


      tabButtons.forEach((button) => {

        button.addEventListener("click", () => {

          activateTab(
            button.dataset.tab
          );

        });

      });


      Object.values(tabFrames).forEach((frame) => {

        frame.addEventListener("load", () => {

          resizeFrame(frame);

          try {

            const observer = new MutationObserver(
              () => resizeFrame(frame)
            );

            observer.observe(
              frame.contentWindow.document.body,
              {
                childList: true,
                subtree: true,
                attributes: true
              }
            );

          } catch (e) {

            // Ignore resize errors

          }

        });

      });


      const hashTab =
        window.location.hash.replace("#", "");


      if (hashTab && tabFrames[hashTab]) {

        activateTab(hashTab);

      } else {

        activateTab("normal");

      }

    </script>

  </body>
</html>
