<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="htmx.min.js"></script>
</head>
<body>
<main class="app-shell">

  <header class="app-header">
    <div>
      <span class="eyebrow">University Management &middot; Personnel</span>
      <h1>Staff Registry</h1>
      <p class="sub">Live data from enrolment-service &rarr; database-service</p>
    </div>
    <span class="term-badge">Autumn Term 2026</span>
  </header>

  <section class="panel add-staff-panel">
    <h3>Add staff member</h3>
    <form id="add-staff-form"
          hx-post="http://localhost:5001/staff"
          hx-target="#form-feedback"
          hx-swap="innerHTML"
          hx-on::after-request="if(event.detail.successful) this.reset()">
      <div class="add-form-grid">
        <input type="text" name="given_name" placeholder="Given name" required>
        <input type="text" name="family_name" placeholder="Family name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="text" name="department" placeholder="Dept code (e.g. ASD)" required>
        <select name="employment_type" required>
          <option value="" disabled selected>Employment type</option>
          <option value="Full-time">Full-time</option>
          <option value="Part-time">Part-time</option>
        </select>
        <button type="submit" class="btn btn-primary">+ Add staff</button>
      </div>
      <div id="form-feedback"></div>
    </form>
  </section>

  <section class="main">
    <form class="toolbar"
          hx-get="http://localhost:5001/staff/by-department"
          hx-target="#staff-tbody"
          hx-swap="innerHTML">
      <input type="text" name="department_id" placeholder="Filter by department code (e.g. ASD)">
      <button type="submit" class="btn btn-ghost">Filter</button>
      <button type="button" class="btn btn-ghost"
              hx-get="http://localhost:5001/staff"
              hx-target="#staff-tbody"
              hx-swap="innerHTML">Show all</button>
    </form>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Staff member</th>
            <th>Department</th>
            <th>Employment</th>
            <th>Email</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="staff-tbody"
               hx-get="http://localhost:5001/staff"
               hx-trigger="load, staff-changed from:body"
               hx-swap="innerHTML">
          <tr><td colspan="5" class="empty-row">Loading staff&hellip;</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script>
  // Some routes return non-2xx (404/503) with an HTML fragment describing the
  // problem (e.g. "Staff member not found"). By default htmx only swaps in
  // 2xx responses; this makes those error fragments visible too instead of
  // silently doing nothing.
  document.body.addEventListener('htmx:beforeSwap', function (evt) {
    if (evt.detail.xhr.status >= 400) {
      evt.detail.shouldSwap = true;
    }
  });
</script>

</body>
</html>
