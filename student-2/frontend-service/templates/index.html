<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="app-shell">

  <header class="app-header">
    <div>
      <span class="eyebrow">University Management &middot; Personnel</span>
      <h1>Staff Registry</h1>
      <p class="sub">Live data from enrolment-service &rarr; database-service</p>
    </div>
    <span class="term-badge">Autumn Term 2026</span>
  </header>

  <nav class="tab-nav" aria-label="Application modes">
    <button class="tab-btn is-active" data-tab="normal" type="button">Normal UI</button>
    <button class="tab-btn" data-tab="ai-mode" type="button">AI Mode</button>
  </nav>

  <!-- ================= NORMAL UI TAB ================= -->
  <section class="tab-panel is-active" id="tab-normal">

    <section class="panel add-staff-panel">
      <h3>Add staff member</h3>
      <form id="add-staff-form">
        <div class="add-form-grid">
          <input type="text" name="given_name" placeholder="Given name" required>
          <input type="text" name="family_name" placeholder="Family name" required>
          <input type="email" name="email" placeholder="Email" required>
          <input type="text" name="department" placeholder="Dept code (e.g. ASD)" required>
          <select name="employment_type" required>
            <option value="" disabled selected>Employment type</option>
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Contract">Contract</option>
          </select>
          <button type="submit" class="btn btn-primary">+ Add staff</button>
        </div>
        <div id="form-feedback"></div>
      </form>
    </section>

    <section class="main">
      <form id="filter-form" class="toolbar">
        <input type="text" name="department_id" placeholder="Filter by department code (e.g. ASD)">
        <button type="submit" class="btn btn-ghost">Filter</button>
        <button type="button" id="show-all-btn" class="btn btn-ghost">Show all</button>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Staff member</th>
              <th>Department</th>
              <th>Employment</th>
              <th>Email</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="staff-tbody">
            <tr><td colspan="5" class="empty-row">Loading staff&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </section>

  <!-- ================= AI MODE TAB ================= -->
  <section class="tab-panel" id="tab-ai-mode">
    <section class="panel">
      <h3>Ask the local AI agent</h3>
      <form id="ai-form">
        <div class="ai-form-row">
          <select id="ai-endpoint" name="endpoint">
            <option value="ask">General question</option>
            <option value="ask-with-context">Question with project context</option>
            <option value="pattern-selection">Architecture pattern selection</option>
            <option value="architecture-review">Architecture review</option>
            <option value="adr-review">ADR review</option>
          </select>
        </div>
        <textarea id="ai-question" name="question" rows="4"
                  placeholder="Ask a question, e.g. 'What's a good way to structure a Flask microservice?'" required></textarea>
        <button type="submit" class="btn btn-primary">Ask AI</button>
      </form>

      <div id="ai-conversation" class="ai-conversation"></div>
    </section>
  </section>

</main>

<script>
(function () {
  const API_BASE = "http://localhost:5011";
  const tbody = document.getElementById("staff-tbody");
  const feedback = document.getElementById("form-feedback");

  async function loadStaff(url) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-row">Loading staff&hellip;</td></tr>';
    try {
      const res = await fetch(url);
      const html = await res.text();
      tbody.innerHTML = html;
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty-row">Could not reach enrolment-service. ${err}</td></tr>`;
    }
  }

  function getStaffRow(id) {
    return document.getElementById(`staff-row-${id}`);
  }

  // ---- initial load ----
  loadStaff(`${API_BASE}/staff`);

  // ---- add staff ----
  document.getElementById("add-staff-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);

    try {
      const res = await fetch(`${API_BASE}/staff`, { method: "POST", body: formData });
      const html = await res.text();
      feedback.innerHTML = html;

      if (!html.includes("form-error")) {
        form.reset();
        loadStaff(`${API_BASE}/staff`);
      }
    } catch (err) {
      feedback.innerHTML = `<p class="form-error">Failed to reach enrolment-service: ${err}</p>`;
    }
  });

  // ---- department filter ----
  document.getElementById("filter-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const deptId = new FormData(e.target).get("department_id").trim();
    if (!deptId) {
      loadStaff(`${API_BASE}/staff`);
      return;
    }
    loadStaff(`${API_BASE}/staff/by-department?department_id=${encodeURIComponent(deptId)}`);
  });

  document.getElementById("show-all-btn").addEventListener("click", () => {
    document.getElementById("filter-form").reset();
    loadStaff(`${API_BASE}/staff`);
  });

  // ---- row actions: edit / remove / cancel-edit / update (event delegation) ----
  tbody.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const { action, id, name } = btn.dataset;
    const row = getStaffRow(id);

    if (action === "edit") {
      const res = await fetch(`${API_BASE}/staff/${id}/edit`);
      const html = await res.text();
      if (row) row.outerHTML = html;

    } else if (action === "cancel-edit") {
      const res = await fetch(`${API_BASE}/staff/${id}/view`);
      const html = await res.text();
      if (row) row.outerHTML = html;

    } else if (action === "remove") {
      if (!confirm(`Remove ${name} from the registry?`)) return;
      const res = await fetch(`${API_BASE}/staff/${id}`, { method: "DELETE" });
      if (res.ok && row) row.remove();
    }
  });

  tbody.addEventListener("submit", async (e) => {
    const form = e.target.closest('[data-action="update"]');
    if (!form) return;
    e.preventDefault();

    const id = form.dataset.id;
    const formData = new FormData(form);
    const row = getStaffRow(id);

    const res = await fetch(`${API_BASE}/staff/${id}`, { method: "PUT", body: formData });
    const html = await res.text();
    if (row) row.outerHTML = html;
  });

  // ================= Tab switching =================
  const tabButtons = Array.from(document.querySelectorAll(".tab-btn"));
  const tabPanels = {
    "normal": document.getElementById("tab-normal"),
    "ai-mode": document.getElementById("tab-ai-mode"),
  };

  function activateTab(tabName) {
    tabButtons.forEach((btn) => btn.classList.toggle("is-active", btn.dataset.tab === tabName));
    Object.entries(tabPanels).forEach(([name, panel]) => panel.classList.toggle("is-active", name === tabName));
    window.location.hash = tabName;
  }

  tabButtons.forEach((btn) => btn.addEventListener("click", () => activateTab(btn.dataset.tab)));

  const hashTab = window.location.hash.replace("#", "");
  if (hashTab && tabPanels[hashTab]) activateTab(hashTab);

  // ================= AI Mode =================
  // These fields use "question", these use "architecture_request" (per ai_mode.py)
  const QUESTION_FIELD_ENDPOINTS = new Set(["ask", "ask-with-context"]);

  const aiForm = document.getElementById("ai-form");
  const aiConversation = document.getElementById("ai-conversation");

  function appendMessage(role, html) {
    const bubble = document.createElement("div");
    bubble.className = `ai-bubble ai-bubble-${role}`;
    bubble.innerHTML = html;
    aiConversation.appendChild(bubble);
    aiConversation.scrollTop = aiConversation.scrollHeight;
  }

  aiForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const endpoint = document.getElementById("ai-endpoint").value;
    const questionText = document.getElementById("ai-question").value.trim();
    if (!questionText) return;

    appendMessage("user", questionText.replace(/</g, "&lt;"));

    const fieldName = QUESTION_FIELD_ENDPOINTS.has(endpoint) ? "question" : "architecture_request";
    const body = new URLSearchParams();
    body.set(fieldName, questionText);

    const thinking = document.createElement("div");
    thinking.className = "ai-bubble ai-bubble-agent";
    thinking.textContent = "Thinking\u2026";
    aiConversation.appendChild(thinking);
    aiConversation.scrollTop = aiConversation.scrollHeight;

    try {
      const res = await fetch(`${API_BASE}/${endpoint}`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body.toString(),
      });
      const html = await res.text();
      thinking.remove();
      appendMessage(res.ok ? "agent" : "agent-error", html);
    } catch (err) {
      thinking.remove();
      appendMessage("agent-error", `<p>Failed to reach enrolment-service: ${err}</p>`);
    }

    document.getElementById("ai-question").value = "";
  });
})();
</script>

</body>
</html>
