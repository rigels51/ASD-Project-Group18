services:
  timetable-backend:
    build: ./backend
    container_name: timetable-backend
    ports:
      - "5003:5003"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - OLLAMA_MODEL=qwen2.5:0.5b
      - MCP_SERVER_URL=http://host.docker.internal:8000/mcp
      - MCP_ENABLED=true
      - RAG_SERVER_URL=http://host.docker.internal:5050
      - RAG_ENABLED=true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  timetable-frontend:
    build: ./frontend
    container_name: timetable-frontend
    ports:
      - "8003:80"
    depends_on:
      - timetable-backend
