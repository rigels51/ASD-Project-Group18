name: Yi Zhang - Course and Enrollment

on:
  workflow_dispatch:

  push:
    branches:
      - Yi-Zhang
    paths:
      - 'student-4/**'
      - 'ai-services/mcp-server/**'
      - 'ai-services/rag-server/**'
      - 'prompts/**'
      - 'docker-compose.yml'
      - '.github/workflows/YiZhang.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'student-4/**'
      - 'ai-services/mcp-server/**'
      - 'ai-services/rag-server/**'
      - 'prompts/**'
      - 'docker-compose.yml'
      - '.github/workflows/YiZhang.yml'


jobs:

  build-and-validate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-4/enrolment-service/requirements.txt


      - name: Validate Student 4 database
        run: |
          python -m py_compile student-4/database-service/app.py
          python -m py_compile student-4/database-service/init_db.py


      - name: Validate Student 4 backend
        run: |
          python -m py_compile student-4/enrolment-service/app.py

          python -m py_compile student-4/enrolment-service/routes/normal_ui.py
          python -m py_compile student-4/enrolment-service/routes/ai_mode.py
          python -m py_compile student-4/enrolment-service/routes/mcp_mode.py
          python -m py_compile student-4/enrolment-service/routes/rag_mode.py

          python -m py_compile student-4/enrolment-service/services/database_api.py
          python -m py_compile student-4/enrolment-service/services/llm_client.py
          python -m py_compile student-4/enrolment-service/services/prompt_loader.py
          python -m py_compile student-4/enrolment-service/services/mcp_api.py
          python -m py_compile student-4/enrolment-service/services/rag_api.py

          python -m py_compile student-4/enrolment-service/views/html_formatters.py


      - name: Validate Student 4 MCP integration
        run: |
          python -m py_compile ai-services/mcp-server/student4_tools.py
          python -m py_compile ai-services/mcp-server/server.py


      - name: Validate Student 4 RAG integration
        run: |
          python -m py_compile ai-services/rag-server/student4_rag.py
          python -m py_compile ai-services/rag-server/rag_http_server.py


      - name: Build Student 4 frontend
        run: |
          docker build \
            -f student-4/frontend-service/Dockerfile \
            -t student4-frontend \
            student-4/frontend-service


      - name: Build Student 4 enrolment service
        run: |
          docker build \
            -f student-4/enrolment-service/Dockerfile \
            -t student4-enrolment \
            .


      - name: Build Student 4 database service
        run: |
          docker build \
            -f student-4/database-service/Dockerfile \
            -t student4-database \
            student-4/database-service


      - name: Validate Docker Compose
        run: |
          docker compose config


      - name: Verify Student 4 Release 1 configuration
        run: |
          grep -q "MCP_ENABLED" docker-compose.yml
          grep -q "MCP_SERVER_URL" docker-compose.yml
          grep -q "RAG_ENABLED" docker-compose.yml
          grep -q "RAG_SERVER_URL" docker-compose.yml

          echo "Student 4 MCP and RAG configuration found."


      - name: Student 4 Release 1 validation complete
        run: |
          echo "Student 4 Course and Enrollment validation passed."
          echo "Database validation: PASS"
          echo "Backend validation: PASS"
          echo "MCP validation: PASS"
          echo "RAG validation: PASS"
          echo "Docker build validation: PASS"