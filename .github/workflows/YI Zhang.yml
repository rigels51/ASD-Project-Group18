name: Yi Zhang - Course and Enrollment

on:
  push:
    branches:
      - Yi-Zhang

  pull_request:
    branches:
      - main


jobs:
  build-and-validate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install enrolment service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r enrolment-service/requirements.txt


      - name: Validate Python syntax
        run: |
          python -m py_compile database-service/app.py
          python -m py_compile database-service/init_db.py
          python -m py_compile enrolment-service/routes/normal_ui.py
          python -m py_compile enrolment-service/routes/ai_mode.py
          python -m py_compile enrolment-service/services/database_api.py
          python -m py_compile enrolment-service/services/llm_client.py
          python -m py_compile enrolment-service/views/html_formatters.py


      - name: Build frontend service
        run: |
          docker build \
            -f frontend-service/Dockerfile \
            -t yi-course-frontend \
            .


      - name: Build enrolment service
        run: |
          docker build \
            -f enrolment-service/Dockerfile \
            -t yi-course-enrolment \
            .


      - name: Build database service
        run: |
          docker build \
            -f database-service/Dockerfile \
            -t yi-course-database \
            .


      - name: Validate Docker Compose
        run: |
          docker compose config