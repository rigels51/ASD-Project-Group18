name: Yi Zhang - Course and Enrollment

on:
  push:
    branches:
      - Yi-Zhang
    paths:
      - 'Student4/**'
      - '.github/workflows/YiZhang.yml'
      - 'prompts/**'

  pull_request:
    branches:
      - main
    paths:
      - 'Student4/**'
      - '.github/workflows/YiZhang.yml'
      - 'prompts/**'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install enrolment service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Student4/enrolment-service/requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile Student4/database-service/app.py
          python -m py_compile Student4/database-service/init_db.py
          python -m py_compile Student4/enrolment-service/app.py
          python -m py_compile Student4/enrolment-service/routes/normal_ui.py
          python -m py_compile Student4/enrolment-service/routes/ai_mode.py
          python -m py_compile Student4/enrolment-service/services/database_api.py
          python -m py_compile Student4/enrolment-service/services/llm_client.py
          python -m py_compile Student4/enrolment-service/services/prompt_loader.py
          python -m py_compile Student4/enrolment-service/views/html_formatters.py

      - name: Build frontend service
        run: docker build -f Student4/frontend-service/Dockerfile -t yi-course-frontend Student4/frontend-service

      - name: Build enrolment service
        run: docker build -f Student4/enrolment-service/Dockerfile -t yi-course-enrolment .

      - name: Build database service
        run: docker build -f Student4/database-service/Dockerfile -t yi-course-database Student4/database-service

      - name: Validate Docker Compose
        run: docker compose -f Student4/docker-compose.yml config