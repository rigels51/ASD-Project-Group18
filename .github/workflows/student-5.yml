name: Student 5 - Assessment & Grades CI (Vu Tien Thanh Nguyen)

on:
  push:
    paths:
      - "student-5/**"
      - ".github/workflows/student-5.yml"
  pull_request:
    paths:
      - "student-5/**"
      - ".github/workflows/student-5.yml"
  workflow_dispatch:

env:
  # Release 1/2 AI services are local-only and disabled in CI (integration code stays in the app).
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  MULTI_AGENT_ENABLED: "false"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-5/backend/requirements.txt pytest

      - name: Offline unit tests (MCP, RAG and Multi-Agent routes, servers mocked)
        run: python -m pytest student-5/tests/test_mcp_rag_routes.py student-5/tests/test_multi_agent_routes.py -v

      - name: Build images (database, backend/API, frontend)
        run: |
          docker build -f student-5/database/Dockerfile -t assessment-database-service:ci student-5/database
          docker build -f student-5/backend/Dockerfile -t assessment-service:ci .
          docker build -t assessment-frontend-service:ci student-5/frontend

      - name: Start database + backend containers
        run: |
          docker network create assessment-ci-net
          docker run -d --name assessment-database-service --network assessment-ci-net -p 5022:5022 assessment-database-service:ci
          docker run -d --name assessment-service --network assessment-ci-net -p 5021:5021 \
            -e ASSESSMENT_DATABASE_SERVICE_URL=http://assessment-database-service:5022 \
            -e MCP_ENABLED -e RAG_ENABLED -e MULTI_AGENT_ENABLED \
            assessment-service:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:5021/assessments >/dev/null && echo "backend ready" && exit 0
            sleep 1
          done
          echo "backend did not start"; exit 1

      - name: Post-commit endpoint tests - GET /assessments and POST /assessments
        env:
          ASSESSMENT_BACKEND_URL: http://localhost:5021
          ASSESSMENT_DATABASE_URL: http://localhost:5022
        run: |
          python -m pytest student-5/tests/test_endpoints_ci.py -v \
            --junitxml=student5-endpoint-tests.xml | tee student5-endpoint-tests.txt

      - name: AI services report disabled in CI
        run: |
          for path in /multi-agent/run /rag/ask; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:5021$path?format=json" -d "question=x")
            test "$code" = "503" || { echo "$path expected 503, got $code"; exit 1; }
          done
          echo "MCP/RAG/Multi-Agent correctly disabled"

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Student 5 - endpoint tests"
            echo "Endpoints: \`GET /assessments\` (get_assessments_route), \`POST /assessments\` (create_assessment_route)"
            echo '```'
            tail -n 15 student5-endpoint-tests.txt 2>/dev/null || echo "endpoint tests did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student5-endpoint-test-results
          path: |
            student5-endpoint-tests.xml
            student5-endpoint-tests.txt

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs assessment-database-service || true
          docker logs assessment-service || true

      - name: Clean up
        if: always()
        run: |
          docker rm -f assessment-database-service assessment-service || true
          docker network rm assessment-ci-net || true

