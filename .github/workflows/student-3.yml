name: Student 3 - Timetable & Class Scheduling CI

on:
  push:
    branches:
      - main
      - 'student-3/**'
    paths:
      - 'student-3/**'
      - 'ai-services/mcp-server/timetable_tools.py'
      - 'ai-services/mcp-server/test_timetable_tools.py'
      - 'ai-services/rag-server/timetable_rag.py'
      - 'ai-services/rag-server/test_timetable_rag.py'
      - 'ai-services/rag-server/corpus/timetable_policy.md'
      - '.github/workflows/student-3.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'student-3/**'
      - 'ai-services/mcp-server/timetable_tools.py'
      - 'ai-services/mcp-server/test_timetable_tools.py'
      - 'ai-services/rag-server/timetable_rag.py'
      - 'ai-services/rag-server/test_timetable_rag.py'
      - 'ai-services/rag-server/corpus/timetable_policy.md'
      - '.github/workflows/student-3.yml'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-3/backend/requirements.txt pytest

      - name: Initialise database
        working-directory: student-3/backend
        run: python init_db.py

      - name: Verify database seeded correctly
        working-directory: student-3/backend
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('timetable.db')
          count = conn.execute('SELECT COUNT(*) FROM timetable').fetchone()[0]
          assert count == 10, f'Expected 10 seed records, found {count}'
          print(f'Database check passed: {count} records')
          "

      - name: Release 2 post-commit endpoint tests - POST /timetable and GET /timetable/clashes
        working-directory: student-3/backend
        run: |
          set -o pipefail
          mkdir -p test-reports
          python -m pytest tests/test_endpoints.py -v \
            --junitxml=test-reports/endpoint-tests.xml | tee test-reports/endpoint-tests.txt
          {
            echo "## Student 3 - post-commit endpoint tests"
            echo "Commit: \`${GITHUB_SHA::7}\` by ${GITHUB_ACTOR}"
            echo ""
            echo "| Endpoint function | Route | Tests |"
            echo "|---|---|---|"
            echo "| create_session | POST /timetable | $(grep -c 'TestCreateSession.*PASSED' test-reports/endpoint-tests.txt) passed |"
            echo "| get_clashes | GET /timetable/clashes | $(grep -c 'TestClashDetection.*PASSED' test-reports/endpoint-tests.txt) passed |"
            echo ""
            echo "\`$(tail -1 test-reports/endpoint-tests.txt)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests - backend MCP, RAG and Multi-Agent routes (servers mocked)
        working-directory: student-3/backend
        run: python -m pytest tests/test_release1.py tests/test_multi_agent_routes.py -v --junitxml=test-reports/route-tests.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-3-test-reports
          path: student-3/backend/test-reports/

      - name: Unit tests - Timetable tools on the shared MCP server
        working-directory: ai-services/mcp-server
        run: python -m unittest test_timetable_tools -v

      - name: Unit tests - Timetable domain on the shared RAG server (Ollama mocked)
        working-directory: ai-services/rag-server
        run: python -m unittest test_timetable_rag -v

      - name: Start backend server (MCP, RAG and Multi-Agent disabled)
        working-directory: student-3/backend
        env:
          MCP_ENABLED: "false"
          RAG_ENABLED: "false"
          MULTI_AGENT_ENABLED: "false"
        run: |
          nohup python app.py > flask.log 2>&1 &
          sleep 3

      - name: Validate core endpoints respond
        run: |
          curl -sf http://127.0.0.1:5003/timetable -o /dev/null
          curl -sf http://127.0.0.1:5003/timetable/1 -o /dev/null
          curl -sf http://127.0.0.1:5003/timetable/clashes -o /dev/null
          curl -sf http://127.0.0.1:5003/api/timetable -o /dev/null
          echo "All core endpoints responded successfully"

      - name: Validate MCP and RAG routes report disabled
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:5003/mcp/call \
            -H "Content-Type: application/json" -d '{"tool":"find_timetable_clashes","arguments":{}}')
          test "$code" = "503" || { echo "Expected 503 from /mcp/call, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:5003/rag/answer \
            -H "Content-Type: application/json" -d '{"question":"When do sessions clash?"}')
          test "$code" = "503" || { echo "Expected 503 from /rag/answer, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:5003/multi-agent/run \
            -H "Content-Type: application/json" -d '{"question":"Summarise ASD101 sessions"}')
          test "$code" = "503" || { echo "Expected 503 from /multi-agent/run, got $code"; exit 1; }
          echo "MCP, RAG and Multi-Agent are correctly feature-flagged off in CI"

      - name: Live check - create a clashing session, then detect it over HTTP
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:5003/timetable \
            -d course_code=CI101 -d session_type=Lab -d day=Monday -d start_time=10:00 \
            -d end_time=12:00 -d room=CB01.02.15 -d semester=2026-S2)
          test "$code" = "201" || { echo "Expected 201 from POST /timetable, got $code"; exit 1; }
          curl -sf http://127.0.0.1:5003/timetable/clashes | grep -q "CI101" \
            || { echo "New overlapping session was not reported as a clash"; exit 1; }
          echo "POST /timetable created the session and GET /timetable/clashes reported it"

      - name: Build backend Docker image
        run: docker build -t timetable-backend student-3/backend

      - name: Build frontend Docker image
        run: docker build -t timetable-frontend student-3/frontend

      - name: Show backend logs on failure
        if: failure()
        working-directory: student-3/backend
        run: cat flask.log || true
