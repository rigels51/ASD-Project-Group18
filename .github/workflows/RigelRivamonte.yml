name: Rigel Rivamonte - Student Records

on:
  workflow_dispatch:

  push:
    branches:
      - rigel
      - main
    paths:
      - 'student-1/**'
      - 'ai-services/mcp-server/**'
      - 'ai-services/rag-server/**'
      - 'docker-compose.yml'
      - '.github/workflows/RigelRivamonte.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'student-1/**'
      - 'ai-services/mcp-server/**'
      - 'ai-services/rag-server/**'
      - 'docker-compose.yml'
      - '.github/workflows/RigelRivamonte.yml'

jobs:
  build-and-validate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Student1 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-1/enrolment-service/requirements.txt
          pip install -r ai-services/mcp-server/requirements.txt
          pip install -r ai-services/rag-server/requirements.txt

      - name: Run student records tests
        run: python -m unittest student-1/tests/test_student_records.py


      - name: Validate Student 1 database and backend syntax
        run: |
          python -m py_compile student-1/database-service/app.py
          python -m py_compile student-1/database-service/init_db.py
          python -m py_compile student-1/enrolment-service/app.py
          python -m py_compile student-1/enrolment-service/routes/normal_ui.py
          python -m py_compile student-1/enrolment-service/routes/ai_mode.py
          python -m py_compile student-1/enrolment-service/routes/mcp_mode.py
          python -m py_compile student-1/enrolment-service/routes/rag_mode.py
          python -m py_compile student-1/enrolment-service/services/database_api.py
          python -m py_compile student-1/enrolment-service/services/llm_client.py
          python -m py_compile student-1/enrolment-service/services/prompt_loader.py
          python -m py_compile student-1/enrolment-service/services/mcp_api.py
          python -m py_compile student-1/enrolment-service/services/rag_api.py
          python -m py_compile student-1/enrolment-service/views/html_formatters.py


      - name: Validate Student 1 MCP integration
        run: |
          python -m py_compile ai-services/mcp-server/student1_tools.py
          python -m py_compile ai-services/mcp-server/server.py


      - name: Validate Student 1 RAG integration
        run: |
          python -m py_compile ai-services/rag-server/student1_rag.py
          python -m py_compile ai-services/rag-server/rag_http_server.py


      - name: Run shared MCP/RAG test suites
        run: |
          python -m unittest discover -s ai-services/mcp-server -p 'test_*.py' -v
          python -m unittest discover -s ai-services/rag-server -p 'test_*.py' -v


      - name: Build frontend service
        run: |
          docker build \
            -f student-1/frontend-service/Dockerfile \
            -t student1-course-frontend \
            student-1/frontend-service


      - name: Build enrolment service
        run: |
          docker build \
            -f student-1/enrolment-service/Dockerfile \
            -t student1-course-enrolment \
            .


      - name: Build database service
        run: |
          docker build \
            -f student-1/database-service/Dockerfile \
            -t student1-course-database \
            student-1/database-service


      - name: Build MCP service
        run: |
          docker build \
            -f ai-services/mcp-server/Dockerfile \
            -t student1-course-mcp \
            .


      - name: Build RAG service
        run: |
          docker build \
            -f ai-services/rag-server/Dockerfile \
            -t student1-course-rag \
            .


      - name: Validate Docker Compose
        run: |
          docker compose config


      - name: Verify Student 1 Release 1 configuration
        run: |
          grep -q "MCP_ENABLED" docker-compose.yml
          grep -q "MCP_SERVER_URL" docker-compose.yml
          grep -q "RAG_ENABLED" docker-compose.yml
          grep -q "RAG_SERVER_URL" docker-compose.yml

          echo "Student 1 MCP and RAG configuration found."
