
repos:
  - repo: local
    hooks:
      - id: ruff-security
        name: Ruff security rules (flake8-bandit S)
        entry: ruff check --force-exclude
        language: python
        additional_dependencies: ["ruff==0.16.9"]
        types: [python]

      - id: detect-secrets
        name: detect-secrets (no new credentials)
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: python
        additional_dependencies: ["detect-secrets==1.5.0"]
        exclude: '(^|/)(#|once)/|\.jsonl$|^\.secrets\.baseline$'

      - id: pip-audit
        name: pip-audit (known-vulnerable dependencies)
        entry: python scripts/pip_audit_hook.py
        language: python
        additional_dependencies: ["pip-audit==2.10.1"]
        files: '(^|/)requirements[^/]*\.txt$'