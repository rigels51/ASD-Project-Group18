services:
    student1-frontend:
        build:
            context: ./student-1/frontend-service
        container_name: student1-frontend
        ports:
            - "8080:80"
        depends_on:
            - student1-enrolment
        networks:
            - enrolment-network
        restart: unless-stopped

    student1-enrolment:
        build:
            context: .
            dockerfile: student-1/enrolment-service/Dockerfile
        container_name: student1-enrolment
        ports:
            - "5001:5001"
        environment:
            DATABASE_SERVICE_URL: http://student1-database:5002
            OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
            OLLAMA_MODEL: qwen2.5:0.5b
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - student1-database
        networks:
            - enrolment-network
        restart: unless-stopped

    student1-database:
        build:
            context: ./student-1/database-service
        container_name: student1-database
        ports:
            - "5002:5002"
        volumes:
            - student1_database_data:/app/data
        networks:
            enrolment-network:
                aliases:
                    - student1-database
        restart: unless-stopped

    student2-frontend:
        build:
            context: ./student-2/frontend-service
        container_name: student2-frontend
        ports:
            - "8082:80"
        depends_on:
            - student2-backend
        networks:
            - enrolment-network
        restart: unless-stopped

    student2-backend:
        build:
            context: .
            dockerfile: student-2/backend-service/Dockerfile
        container_name: student2-backend
        ports:
            - "5011:5001"
        environment:
            DATABASE_SERVICE_URL: http://student2-database:5002
            OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
            OLLAMA_MODEL: qwen2.5:0.5b
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - student2-database
        networks:
            - enrolment-network
        restart: unless-stopped

    student2-database:
        build:
            context: ./student-2/database-service
        container_name: student2-database
        ports:
            - "5012:5002"
        volumes:
            - student2_database_data:/app/data
        networks:
            enrolment-network:
                aliases:
                    - student2-database
        restart: unless-stopped

    student4-frontend:
        build:
            context: ./student-4/frontend-service
        container_name: student4-frontend
        ports:
            - "8081:80"
        depends_on:
            - student4-enrolment
        networks:
            - enrolment-network
        restart: unless-stopped

    student4-enrolment:
        build:
            context: .
            dockerfile: student-4/enrolment-service/Dockerfile
        container_name: student4-enrolment
        ports:
            - "5031:5001"
        environment:
            DATABASE_SERVICE_URL: http://student4-database:5002
            OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
            OLLAMA_MODEL: qwen2.5:0.5b
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - student4-database
        networks:
            - enrolment-network
        restart: unless-stopped

    student4-database:
        build:
            context: ./student-4/database-service
        container_name: student4-database
        ports:
            - "5032:5002"
        volumes:
            - student4_database_data:/app/data
        networks:
            enrolment-network:
                aliases:
                    - student4-database
        restart: unless-stopped

    assessment-database-service:
        build:
            context: .
            dockerfile: student-5/database/Dockerfile
        container_name: assessment-database-service
        ports:
            - "5022:5022"
        volumes:
            - assessment_grades_data:/app/data
        networks:
            enrolment-network:
                aliases:
                    - assessment-database-service
        restart: unless-stopped

    assessment-service:
        build:
            context: .
            dockerfile: student-5/backend/Dockerfile
        container_name: assessment-service
        ports:
            - "5021:5021"
        environment:
            ASSESSMENT_DATABASE_SERVICE_URL: http://assessment-database-service:5022
            OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
            OLLAMA_MODEL: qwen2.5:0.5b
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - assessment-database-service
        networks:
            - enrolment-network
        restart: unless-stopped

    assessment-frontend-service:
        build:
            context: ./student-5/frontend
        container_name: assessment-frontend-service
        ports:
            - "8085:80"
        depends_on:
            - assessment-service
        networks:
            - enrolment-network
        restart: unless-stopped

    timetable-backend:
        build:
            context: ./student-3/backend
        container_name: timetable-backend
        ports:
            - "5003:5003"
        environment:
            OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
            OLLAMA_MODEL: qwen2.5:0.5b
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - enrolment-network
        restart: unless-stopped

    timetable-frontend:
        build:
            context: ./student-3/frontend
        container_name: timetable-frontend
        ports:
            - "8003:80"
        depends_on:
            - timetable-backend
        networks:
            - enrolment-network
        restart: unless-stopped

volumes:
    student1_database_data:
    student2_database_data:
    student4_database_data:
    assessment_grades_data:

networks:
    enrolment-network:
        driver: bridge