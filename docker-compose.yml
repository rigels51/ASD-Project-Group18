services:
    frontend-service:
        build:
            context: ./frontend-service
        container_name: frontend-service
        ports:
            - "8080:80"
        depends_on:
            - enrolment-service
        networks:
            - enrolment-network
        restart: unless-stopped

    enrolment-service:
        build:
            context: .
            dockerfile: enrolment-service/Dockerfile
        container_name: enrolment-service
        ports:
            - "5001:5001"
        environment:
            DATABASE_SERVICE_URL: http://database-service:5002
            OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
            OLLAMA_MODEL: qwen2.5:0.5b
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - database-service
        networks:
            - enrolment-network
        restart: unless-stopped

    database-service:
        build:
            context: ./database-service
        container_name: database-service
        ports:
            - "5002:5002"
        volumes:
            - database_data:/app/data
        networks:
            enrolment-network:
                aliases:
                    - database-service
        restart: unless-stopped

    assessment-database-service:
        build:
            context: .
            dockerfile: student-5/database/Dockerfile
        container_name: assessment-database-service
        ports:
            - "5022:5022"
        volumes:
            - assessment_grades_data:/app/data
        networks:
            enrolment-network:
                aliases:
                    - assessment-database-service
        restart: unless-stopped

    assessment-service:
        build:
            context: .
            dockerfile: student-5/backend/Dockerfile
        container_name: assessment-service
        ports:
            - "5021:5021"
        environment:
            ASSESSMENT_DATABASE_SERVICE_URL: http://assessment-database-service:5022
            OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
            OLLAMA_MODEL: qwen2.5:0.5b
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - assessment-database-service
        networks:
            - enrolment-network
        restart: unless-stopped

    timetable-backend:
        build:
            context: ./student-3/backend
        container_name: timetable-backend
        ports:
            - "5003:5003"
        environment:
            OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
            OLLAMA_MODEL: qwen2.5:0.5b
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - enrolment-network
        restart: unless-stopped

    timetable-frontend:
        build:
            context: ./student-3/frontend
        container_name: timetable-frontend
        ports:
            - "8003:80"
        depends_on:
            - timetable-backend
        networks:
            - enrolment-network
        restart: unless-stopped

volumes:
    database_data:
    assessment_grades_data:

networks:
    enrolment-network:
        driver: bridge