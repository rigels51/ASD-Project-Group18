<!doctype html>
<html>
  <head>
    <title>University Management - Assessment & Grades Management</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <h1>Assessment & Grades Management</h1>
        <p>Spring 2026</p>
      </header>

      <section class="tab-shell card">
        <nav class="tab-nav" aria-label="Application tabs">
          <button class="tab-btn is-active" data-tab="normal" type="button">
            Normal UI
          </button>
          <button class="tab-btn" data-tab="ai-mode" type="button">
            AI Mode
          </button>
        </nav>

        <div class="tab-content">
          <iframe
            id="tab-frame-normal"
            class="tab-frame is-active"
            src="tabs/normal.html"
            title="Normal UI"
          ></iframe>
          <iframe
            id="tab-frame-ai-mode"
            class="tab-frame"
            src="tabs/ai-mode.html"
            title="AI Mode"
          ></iframe>
        </div>
      </section>
    </main>

    <script>
      const tabButtons = Array.from(document.querySelectorAll(".tab-btn"));

      const tabFrames = {
        normal: document.getElementById("tab-frame-normal"),
        "ai-mode": document.getElementById("tab-frame-ai-mode"),
      };

      function resizeFrame(frame) {
        try {
          const doc = frame.contentWindow.document;
          const height = Math.max(
            doc.body.scrollHeight,
            doc.documentElement.scrollHeight,
          );
          frame.style.height = height + "px";
        } catch (e) {
          // cross-origin or not yet loaded — CSS min-height fallback applies
        }
      }

      function activateTab(tabName) {
        tabButtons.forEach((button) => {
          button.classList.toggle("is-active", button.dataset.tab === tabName);
        });

        Object.entries(tabFrames).forEach(([name, frame]) => {
          const isActive = name === tabName;
          frame.classList.toggle("is-active", isActive);
          if (isActive) resizeFrame(frame);
        });

        window.location.hash = tabName;
      }

      tabButtons.forEach((button) => {
        if (button.disabled) {
          return;
        }

        button.addEventListener("click", () => {
          activateTab(button.dataset.tab);
        });
      });

      // Re-measure whenever a tab's content changes size (search results
      // loading, drawer opening, rows being added/removed, etc.)
      Object.values(tabFrames).forEach((frame) => {
        frame.addEventListener("load", () => {
          resizeFrame(frame);
          try {
            const observer = new MutationObserver(() => resizeFrame(frame));
            observer.observe(frame.contentWindow.document.body, {
              childList: true,
              subtree: true,
              attributes: true,
            });
          } catch (e) {
            /* ignore */
          }
        });
      });

      const hashTab = window.location.hash.replace("#", "");
      if (hashTab && tabFrames[hashTab]) {
        activateTab(hashTab);
      } else {
        activateTab("normal");
      }
    </script>
  </body>
</html>
