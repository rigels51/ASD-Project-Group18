
services:
    assessment-database-service:
        build:
            context: ./database
        container_name: assessment-database-service
        ports:
            - "5022:5022"
        volumes:
            - assessment_grades_data:/app/data
        networks:
            enrolment-network:
                aliases:
                    - assessment-database-service
        restart: unless-stopped

    assessment-service:
        build:
            context: ..
            dockerfile: student-5/backend/Dockerfile
        container_name: assessment-service
        ports:
            - "5021:5021"
        environment:
            ASSESSMENT_DATABASE_SERVICE_URL: http://assessment-database-service:5022
           
            STUDENT_SERVICE_URL: http://student1-database:5002
            COURSE_SERVICE_URL: http://student4-database:5002
            OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
            OLLAMA_MODEL: qwen2.5:0.5b
            # Release 1: shared MCP / RAG servers run locally on the host (not in Docker)
            MCP_SERVER_URL: http://host.docker.internal:8000/mcp
            MCP_ENABLED: "true"
            RAG_SERVER_URL: http://host.docker.internal:5050
            RAG_ENABLED: "true"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - assessment-database-service
        networks:
            - enrolment-network
        restart: unless-stopped

    assessment-frontend-service:
        build:
            context: ./frontend
        container_name: assessment-frontend-service
        ports:
            - "8085:80"
        depends_on:
            - assessment-service
        networks:
            - enrolment-network
        restart: unless-stopped

volumes:
    assessment_grades_data:

networks:
    enrolment-network:
        driver: bridge
