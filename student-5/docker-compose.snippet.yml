# Add these three service blocks into the team's shared root docker-compose.yml,
# alongside everyone else's services. Also add "assessment_grades_data" to the
# top-level "volumes:" section (only the database needs a volume).
#
# Ports used (none of these collide with student1 5001/5002, Student2 5011/5012,
# or Student4 5031/5032):
#   assessment-database-service  -> 5022
#   assessment-service            -> 5021
#   assessment-frontend-service   -> 8085 (host) -> 80 (container)

services:
    assessment-database-service:
        build:
            context: .
            dockerfile: student-5/database/Dockerfile
        container_name: assessment-database-service
        ports:
            - "5022:5022"
        volumes:
            - assessment_grades_data:/app/data
        networks:
            enrolment-network:
                aliases:
                    - assessment-database-service
        restart: unless-stopped

    assessment-service:
        build:
            context: .
            dockerfile: student-5/backend/Dockerfile
        container_name: assessment-service
        ports:
            - "5021:5021"
        environment:
            ASSESSMENT_DATABASE_SERVICE_URL: http://assessment-database-service:5022
            OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
            OLLAMA_MODEL: qwen2.5:0.5b
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - assessment-database-service
        networks:
            - enrolment-network
        restart: unless-stopped

    # Optional: run the Assessment & Grades UI as its own standalone container
    # (useful for demoing/testing this feature in isolation). If the team's
    # unified home page already embeds frontend-service/templates/tabs/assessment-grades.html
    # as a tab, you don't need to run this too — it's the same UI either way.
    assessment-frontend-service:
        build:
            context: ./student-5/frontend
        container_name: assessment-frontend-service
        ports:
            - "8085:80"
        depends_on:
            - assessment-service
        networks:
            - enrolment-network
        restart: unless-stopped

volumes:
    assessment_grades_data:
