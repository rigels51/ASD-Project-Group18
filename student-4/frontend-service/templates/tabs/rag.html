<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Student 4 RAG Mode</title>

  <link rel="stylesheet" href="/css/styles.css">

  <script src="https://unpkg.com/htmx.org@1.9.12"></script>

  <style>
    body {
      margin: 0;
      background: transparent;
    }

    .rag-container {
      padding: 20px;
    }

    .rag-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .rag-form {
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .rag-form input {
      padding: 8px;
      min-width: 320px;
      margin-right: 8px;
    }

    .rag-result {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      min-height: 100px;
      overflow-x: auto;
    }

    .rag-status {
      margin-bottom: 15px;
    }

    .hint {
      margin-top: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="rag-container">

    <h2>RAG Mode</h2>

    <p>
      Ask questions using retrieved Course & Enrollment evidence.
    </p>

    <div class="rag-status">
      <strong>RAG Status:</strong>
      <span>Enabled</span>
    </div>

    <div class="rag-actions">

      <button
        type="button"
        hx-post="http://localhost:5031/rag/refresh"
        hx-target="#rag-result"
        hx-swap="innerHTML"
      >
        Refresh Corpus
      </button>

    </div>


    <form
      class="rag-form"
      hx-post="http://localhost:5031/rag/retrieve"
      hx-target="#rag-result"
      hx-swap="innerHTML"
    >

      <label for="retrieve-query">
        Retrieve Context:
      </label>

      <br><br>

      <input
        id="retrieve-query"
        name="query"
        type="text"
        placeholder="Example: What is ASD101?"
        required
      >

      <button type="submit">
        Retrieve
      </button>

    </form>


    <form
      class="rag-form"
      hx-post="http://localhost:5031/rag/answer"
      hx-target="#rag-result"
      hx-swap="innerHTML"
    >

      <label for="answer-query">
        Ask with RAG:
      </label>

      <br><br>

      <input
        id="answer-query"
        name="query"
        type="text"
        placeholder="Example: What is ASD101?"
        required
      >

      <button type="submit">
        Answer with Citations
      </button>

      <div class="hint">
        The answer should include retrieved evidence,
        citations and confidence.
      </div>

    </form>


    <div
      id="rag-result"
      class="rag-result"
    >
      RAG results will appear here.
    </div>

  </div>

</body>
</html>
